name: CoupleVault
options:
  bundleIdPrefix: tech.neatnet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CoupleVault:
    type: application
    platform: iOS
    sources:
      - path: CoupleVault
    info:
      path: CoupleVault/Info.plist
      properties:
        CFBundleDisplayName: between
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Unlock your vault with Face ID.
        NSCameraUsageDescription: Scan your partner's pairing code. Nothing is recorded or saved.
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: tech.neatnet.nvlt
            UTTypeDescription: Encrypted vault exchange package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nvlt]
              public.mime-type: [application/octet-stream]
        CFBundleDocumentTypes:
          - CFBundleTypeName: NVLT Exchange Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.neatnet.nvlt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.neatnet.couplevault
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CoupleVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoupleVaultTests
    dependencies:
      - target: CoupleVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.neatnet.couplevault.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoupleVault.app/CoupleVault
        BUNDLE_LOADER: $(TEST_HOST)
