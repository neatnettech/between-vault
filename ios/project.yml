name: BetweenVault
options:
  bundleIdPrefix: tech.neatnet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Here rather than in Xcode's Signing editor: xcodegen rewrites project.pbxproj, so a team
    # picked there is lost on every regenerate. CI builds unsigned and ignores it.
    DEVELOPMENT_TEAM: T43652ZX7H
targets:
  BetweenVault:
    type: application
    platform: iOS
    sources:
      - path: BetweenVault
        # Local tool state (gitignored) must never become an app resource.
        excludes: ["**/.omc"]
    info:
      path: BetweenVault/Info.plist
      properties:
        CFBundleDisplayName: Between Vault
        # Track the build settings so the tag, project.yml and the bundle cannot drift.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Unlock your vault with Face ID.
        NSCameraUsageDescription: Scan your partner's pairing code. Nothing is recorded or saved.
        # Exchange nearby: the two phones connect directly, only while that screen is open.
        NSLocalNetworkUsageDescription: Exchange nearby connects directly to your partner's iPhone, with no internet and no server. Only while that screen is open.
        NSBonjourServices: [_bvexchange._tcp]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        # Ours, so exported, not imported (rows 3.7, 5.1).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tech.neatnet.nvlt
            UTTypeDescription: Encrypted vault exchange package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nvlt]
              public.mime-type: [application/octet-stream]
          - UTTypeIdentifier: tech.neatnet.nvrec
            UTTypeDescription: Between Vault recovery file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nvrec]
              public.mime-type: [application/octet-stream]
        CFBundleDocumentTypes:
          - CFBundleTypeName: NVLT Exchange Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.neatnet.nvlt]
          - CFBundleTypeName: Between Vault Recovery File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.neatnet.nvrec]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.neatnet.betweenvault
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Settings icon picker: the keyhole is the one alternate, both from the "App icon
        # concepts" board.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconKeyhole
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
  BetweenVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetweenVaultTests
        excludes: ["**/.omc"]
    dependencies:
      - target: BetweenVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.neatnet.betweenvault.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BetweenVault.app/BetweenVault
        BUNDLE_LOADER: $(TEST_HOST)
# Shared, so Xcode Cloud can see it: an autocreated scheme lives only on one Mac.
schemes:
  BetweenVault:
    build:
      targets:
        BetweenVault: all
        BetweenVaultTests: [test]
    test:
      targets: [BetweenVaultTests]
    archive:
      config: Release
