name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (iOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      # project.yml is the source of truth. Regenerating here proves the committed
      # project.pbxproj is not stale and that the spec still produces a valid project.
      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Fail if the generated project differs from the committed one
        working-directory: ios
        run: |
          if ! git diff --quiet -- BetweenVault.xcodeproj; then
            echo "::error::project.pbxproj is out of date. Run 'xcodegen generate' in ios/ and commit the result."
            git diff --stat -- BetweenVault.xcodeproj
            exit 1
          fi

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project BetweenVault.xcodeproj \
            -scheme BetweenVault \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -destination-timeout 180 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/TestResults.xcresult
          retention-days: 7
